name: CI/CD Deployment

on:
  push:
    branches:
      - main # 如果您的預設分支是 master，請將其改為 master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 從 GitHub Secrets 動態生成 .env 檔案（推薦做法，金鑰集中在 GitHub 管理）
      - name: Create .env file from Secrets
        run: |
          echo "MONGODB_URL=${{ secrets.MONGODB_URL }}" > .env
          echo "DATABASE_NAME=${{ secrets.DATABASE_NAME }}" >> .env
          echo "CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}" >> .env
          echo "DEBUG=${{ secrets.DEBUG }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "EXCHANGE_RATE_API_KEY=${{ secrets.EXCHANGE_RATE_API_KEY }}" >> .env
          echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" >> .env

      # 如果您不想將金鑰上傳到 GitHub Secrets，也可以直接讀取內網伺服器本機某個路徑下的 .env，例如：
      # - name: Copy local .env
      #   run: cp /home/koying/deploy/Travel-App/.env .env

      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose up -d --build
